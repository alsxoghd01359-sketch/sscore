# ?? ?? ??
spring.config.import=optional:file:.env[.properties]
server.port=8080

# MySQL ??
spring.datasource.url=jdbc:mysql://localhost:3306/sscore_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA ??
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway: existing DB is treated as V1 (baseline); V2+ are applied
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# initial current-season load on startup when DB is empty
sscore.init.enabled=true

# Mail (verification code). Off by default: the code is written to the server log instead.
# To send real mail set MAIL_ENABLED=true and the MAIL_* values in .env
sscore.mail.enabled=${MAIL_ENABLED:false}
sscore.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT signing key (set JWT_SECRET in .env, 32+ chars). Without it a temporary key is used on each start.
sscore.jwt.secret=${JWT_SECRET:}

# ADMIN accounts: comma separated emails (set ADMIN_EMAILS in .env)
sscore.admin.emails=${ADMIN_EMAILS:}

# Supported leagues (API-Football league ids, comma separated). Default: Big 5 (EPL, La Liga, Bundesliga, Serie A, Ligue 1)
sscore.football.league-ids=39,140,78,135,61

# Live score refresh: every 15 s, only while a match may be in play (see LiveMatchSync)
sscore.live.enabled=true
sscore.live.interval-ms=15000

# How long a match in progress is kept in memory (info / lineups), seconds
sscore.match.cache-seconds=30

# Push (FCM). Put the Firebase service account key at this path to send real pushes; without it pushes are only logged. See docs/firebase-setup.md
sscore.push.credentials-file=${FIREBASE_CREDENTIALS_FILE:firebase-service-account.json}
