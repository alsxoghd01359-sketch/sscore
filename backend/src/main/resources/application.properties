# ?? ?? ??
spring.config.import=optional:file:.env[.properties]
server.port=8080

# MySQL ??
spring.datasource.url=jdbc:mysql://localhost:3306/sscore_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA ??
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway: existing DB is treated as V1 (baseline); V2+ are applied
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# initial current-season load on startup when DB is empty
sscore.init.enabled=true
